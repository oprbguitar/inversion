name: Actualizar datos y publicar

# El BCRP y comparabien.com.pe no envian cabeceras CORS, asi que el navegador no
# puede consultarlos desde GitHub Pages. Esta accion hace la consulta del lado del
# servidor y publica un snapshot que el portal lee en cada visita.
on:
  schedule:
    - cron: '0 11,23 * * *'   # 06:00 y 18:00 hora de Peru (UTC-5)
  workflow_dispatch:           # permite lanzarla a mano desde la pestana Actions
  push:
    branches: [main]

# GitHub Pages publica directamente desde main:/docs, asi que el sitio sigue
# en linea aunque esta accion falle o se retrase. Aqui solo se refrescan los
# datos: al hacer commit, Pages se reconstruye solo.
permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet openpyxl

      - name: Consultar BCRP y comparabien
        id: fetch
        continue-on-error: true   # si una fuente esta caida, se publica igual con el snapshot previo
        run: python tools/fetch_live.py

      - name: Regenerar el Excel descargable
        run: python tools/build_xlsx.py

      - name: Publicar cambios en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json docs/descargas/*.xlsx
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualizacion automatica $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
